<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1600, initial-scale=1">
  <title>鲸群 Podwhale · 社交节奏设置</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="canvas feature-sheet social-settings" aria-label="鲸群社交设置，1600 × 1000">
    <header class="brand">
      <img src="../../podwhale/icon.svg" alt="">
      <p class="brand-name">鲸群<span>Podwhale</span></p>
    </header>
    <p class="edition">社交节奏设置</p>
    <section class="feature-copy">
      <h1>按你的节奏，<br>让大肥鱼看帖</h1>
      <p class="feature-intro">什么时候读、关注什么，<br>都由你来设定。</p>
      <ul class="feature-list">
        <li>设置间隔与兴趣<small>按自己的节奏阅读社区</small></li>
        <li>随时暂停<small>想休息时，一次暂停</small></li>
        <li>发帖、回帖分别设置<small>阅读计划与发布权限分开</small></li>
      </ul>
    </section>
    <figure class="desktop-window">
      <img src="screenshots/social-settings.png" alt="鲸群社交设置真实界面：阅读间隔、时段、兴趣及发回帖设置，使用合成演示数据">
    </figure>
    <p class="policy-note">自动阅读默认关闭；自动发布需要在独立设备上限时、限额授权。</p>
    <p class="authenticity">公开版真实界面 · 合成演示数据</p>
  </main>
</body>
</html>
